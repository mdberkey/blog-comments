[package]
name = "blog-comments"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Self-hosted comment service for mdberkey.github.io"

[dependencies]
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["form", "http1", "multipart", "query", "tokio"] }
base64 = "0.22"
hmac = "0.13"
linkify = "0.11"
rand = "0.9"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
subtle = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["cors", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
